name: Deploy .NET App to Cloud Run (Staging)

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g., staging-1.0.0). Defaults to latest.'
        required: false
        default: 'latest'

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }} # Ensure this is set in GitHub repo variables
  GAR_LOCATION: europe-west1 # Match your Terraform region
  SERVICE_NAME: goapp-backend-staging # Match your Terraform cloud_run_service_name variable + environment
  GAR_REPO_ID: app-images # Match your Terraform artifact_registry_repository_id

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x' # Or the specific .NET version used by your app

      - name: Build .NET application
        run: dotnet publish app/app.csproj -c Release -o ./publish

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-oidc-pool/providers/github-oidc-provider'
          service_account: 'github-actions-sa-staging@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker to use Google Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        id: build-image
        run: |
          IMAGE_TAG=${{ github.event.inputs.tag || format('{0}-{1}', github.ref_name, github.sha) }}
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO_ID }}/app:${IMAGE_TAG}"
          docker build -t $IMAGE_URI ./app
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GAR_LOCATION }}
          image: ${{ steps.build-image.outputs.IMAGE_URI }}
          # Environment variables are managed by Terraform but can be overridden here if needed:
          # env_vars: |
          #   DB_HOST=${{ secrets.DB_HOST }}
          #   DB_NAME=${{ secrets.DB_NAME }}
          #   DB_USER=${{ secrets.DB_USER }}
          #   DB_PASSWORD=${{ secrets.DB_PASSWORD }}

      - name: Verify deployment (optional smoke test)
        run: |
          # Retrieve Cloud Run service URL
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GAR_LOCATION }} --project ${{ env.PROJECT_ID }} --format 'value(status.url)')
          echo "Cloud Run service URL: $SERVICE_URL"
          # Simple health check - requires `curl` or similar and service to be publicly accessible or within VPN/VPC
          # For private services, you'd need to run this from a machine that has access to the VPC.
          # For this private service, we assume manual verification or internal tooling.
          echo "Service is private. Access verification needs to be done from within the VPC network."

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "Deployment failed. Attempting to rollback to previous stable revision."
          # This assumes Cloud Run's automatic revision management and previous stable revision exists.
          # For a more explicit rollback, you might store the previous revision name and activate it.
          # Example: gcloud run services update ${{ env.SERVICE_NAME }} --region ${{ env.GAR_LOCATION }} --to-previous --project ${{ env.PROJECT_ID }}
          echo "Cloud Run manages revisions; a new, failed revision will not receive traffic. Restore traffic to previous revision manually if needed."
