replicaCount: 3

image:
  repository: ap-mumbai-1.ocir.io/your_tenancy_namespace/your_ocir_repo_name
  pullPolicy: IfNotPresent
  # Overwrite with the actual image tag from OCI DevOps build_spec.yaml output
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 1001 # Matches the UID created in Dockerfile
  runAsGroup: 1001 # Matches the GID created in Dockerfile
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: LoadBalancer # OKE will provision an OCI Load Balancer
  port: 80 # External service port (for OCI Load Balancer)
  targetPort: 8080 # Application port inside the container

ingress:
  enabled: false # Use OCI Load Balancer directly
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  # Database connection details
  # These should be pulled from OCI Vault secrets in a production environment
  MYSQL_HOST: "" # Placeholder, set by CI/CD
  MYSQL_USER: "" # Placeholder, set by CI/CD
  MYSQL_PASSWORD: "" # Placeholder, set by CI/CD (from OCI Vault)
  PORT: "8080" # Application listening port

# OCI MySQL Database Service configuration
mysql:
  enabled: true
  host: "" # Populated by CI/CD from Terraform output
  username: "admin" # Populated by CI/CD
  password: "" # Populated by CI/CD (from OCI Vault secret)
  database: "appdb" # Default database name