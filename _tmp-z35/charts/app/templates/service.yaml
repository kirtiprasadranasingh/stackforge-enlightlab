apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    # OCI specific annotations for Load Balancer configuration
    service.beta.kubernetes.io/oci-load-balancer-internal: "true" # Ensure internal LB
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible" # Use flexible shape
    service.beta.kubernetes.io/oci-load-balancer-shape-min: "10" # Min bandwidth for flexible shape
    service.beta.kubernetes.io/oci-load-balancer-shape-max: "100" # Max bandwidth for flexible shape
    service.beta.kubernetes.io/oci-load-balancer-subnet1: "{{ .Values.ingress.subnetId | default "" }}" # Optional: specify subnet OCID for LB
    # You may also add health check configuration here if needed
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}