version: 0.1
component: deploy
timeoutInSeconds: 900
steps:
  - type: Command
    name: HelmUpgradeDevelopment
    command: |
      set -euo pipefail
      echo "Deploying to OKE namespace development via helm upgrade --install"
      if [ -d charts/app ]; then
        helm upgrade --install app charts/app \
          --namespace development --create-namespace \
          --set image.tag=${OCI_IMAGE_TAG:-latest} \
          --wait --timeout 10m
      else
        echo "charts/app missing — add Helm chart before production deploy"
        exit 1
      fi
