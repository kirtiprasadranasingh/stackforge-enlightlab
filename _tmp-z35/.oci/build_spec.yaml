version: 0.1
baseCommands:
  - type: "OCI_CLI"
    name: "install_kubectl"
    command: |
      curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
      chmod +x ./kubectl
      sudo mv ./kubectl /usr/local/bin/kubectl
      kubectl version --client
  - type: "OCI_CLI"
    name: "install_helm"
    command: |
      curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
      chmod 700 get_helm.sh
      ./get_helm.sh
      helm version
phases:
  build:
    commands:
      - echo "Starting build phase..."
      - cd app
      - mvn clean package -DskipTests # Build the Java application using Maven
    artifacts:
      - name: "build_artifact"
        type: "BINARY"
        path: "app/target/*.jar" # Path to your Java application JAR
  push:
    commands:
      - echo "Starting push phase..."
      - # OCIR Login (assuming OCI DevOps build runner has appropriate instance principal permissions)
      - echo "Logging into OCIR..."
      - docker login -u 'ADMINISTRATION' -p "$(oci auth token generate --auth instance_principal --token-lifetime 86400)" ${REGION}.ocir.io # Using instance principal for auth
      - # Build and tag Docker image
      - IMAGE_NAME="${REGION}.ocir.io/${NAMESPACE}/${REPO_NAME}:${BUILD_RUN_ID}"
      - docker build -t $IMAGE_NAME -f app/Dockerfile app/
      - docker push $IMAGE_NAME
      - echo "Image pushed to OCIR: $IMAGE_NAME"
      - # Output the image name for the deployment stage
      - echo "OCI_DEVOPS_IMAGE_NAME=$IMAGE_NAME" >> $OCI_DEVOPS_BUILD_OUTPUT_FILE
    artifacts:
      - name: "oci_devops_image_name"
        type: "OCI_DEOPS_BUILD_OUTPUT"
        path: "OCI_DEVOPS_BUILD_OUTPUT_FILE"

# Define parameters for the build (these can be passed from the DevOps pipeline configuration)
# Example: REGION, NAMESPACE, REPO_NAME
# You would set these as parameters in your OCI DevOps build pipeline.
# REGION refers to the OCI region (e.g., ap-mumbai-1)
# NAMESPACE refers to your OCI Object Storage namespace (usually your tenancy name)
# REPO_NAME refers to the OCIR repository name (e.g., oke-app-app-repo)
# BUILD_RUN_ID is automatically provided by OCI DevOps for unique tags