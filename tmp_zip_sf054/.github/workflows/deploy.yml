name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_REGION: ${{ vars.AZURE_REGION || 'westeurope' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'stackforge' }}
  ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME || 'stackforge' }}
  ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME || 'stackforge' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.set-image-uri.outputs.image_uri }}
      prior_task_def_arn: ${{ steps.get-current-service.outputs.current_task_definition_arn }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI output
        id: set-image-uri
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker build -t "${{ steps.set-image-uri.outputs.image_uri }}" .
          docker push "${{ steps.set-image-uri.outputs.image_uri }}"

      - name: Capture prior task definition
        id: get-current-service
        run: |
          CURRENT=$(aws ecs describe-services --cluster "$ECS_CLUSTER_NAME" --services "$ECS_SERVICE_NAME" --query 'services[0].taskDefinition' --output text)
          echo "current_task_definition_arn=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Register task definition with the new image
        id: register-task-definition
        run: |
          set -euo pipefail
          CURRENT="${{ steps.get-current-service.outputs.current_task_definition_arn }}"
          aws ecs describe-task-definition --task-definition "$CURRENT" --query taskDefinition --output json > task-definition.json
          jq --arg image "${{ steps.set-image-uri.outputs.image_uri }}" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            | .containerDefinitions |= map(if .name == "app" then .image = $image else . end)
          ' task-definition.json > task-definition-next.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://task-definition-next.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition_arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy ECS service revision
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --task-definition "${{ steps.register-task-definition.outputs.task_definition_arn }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"

  scaffold_rollback:
    if: failure() && needs.deploy.outputs.prior_task_def_arn != ''
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Rollback ECS service to prior task definition
        run: |
          set -euo pipefail
          PRIOR="${{ needs.deploy.outputs.prior_task_def_arn }}"
          echo "Rolling back to $PRIOR"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --task-definition "$PRIOR" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"
