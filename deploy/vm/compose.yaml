services:
  stackforge:
    image: ${STACKFORGE_IMAGE}
    restart: unless-stopped
    env_file:
      - ${STACKFORGE_ENV_FILE:-stackforge.env}
    expose:
      - "3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      stackforge:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      STACKFORGE_DOMAIN: ${STACKFORGE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
