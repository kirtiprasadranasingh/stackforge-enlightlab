version: 0.2

phases:
  install:
    commands:
      # Install any necessary build tools (e.g., Docker, Java if not already in base image)
      - echo "Installing Docker and Java (if not present)..."
      - yum update -y
      - yum install -y docker java-17-amazon-corretto-devel
      - echo "Docker installed, starting daemon"
      - nohup dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlay2 &
      - timeout 15 sh -c "until docker info; do echo .; sleep 1; done"
      - docker info
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - $(aws ecr get-login --no-include-email --region $AWS_DEFAULT_REGION)
      - REPOSITORY_URI=$ECR_REPOSITORY_URI
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
  build:
    commands:
      - echo "Building the Docker image..."
      - cd app
      - mvn clean package -DskipTests # Build the Java app and create the JAR
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo "Pushing the Docker images to ECR..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Creating imagedefinitions.json file..."
      - printf '[{"name":"java-app-app","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - ls -l
      - cat imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json # This artifact is consumed by the ECS deploy action
    - app/target/*.jar # Include JAR for potential future artifact use