# OCI DevOps Deployment Specification
# This defines the steps for deploying the Helm chart to OKE.

version: 1.0
timeoutInSeconds: 600
inputArtifacts:
  - name: docker_image_artifact # This name must match the output artifact from the build stage
    type: DOCKER_IMAGE
    # The actual image details (repository and tag) will be passed from the build stage.
  - name: helm_chart_artifact
    type: GENERIC_ARTIFACT # Or GIT if the chart is directly from the source repo
    # If the Helm chart is a managed artifact in OCI DevOps, use GENERIC_ARTIFACT
    # If it's part of the source code, it will be available in the working directory.
steps:
  - type: Command
    name: "Set up Kubeconfig"
    command: |
      # This step assumes OCI CLI and kubectl are available in the build runner.
      # Fetch kubeconfig from OKE cluster. Ensure OCI DevOps service principal has permissions.
      oci ce cluster get-kubeconfig --cluster-id "${OKE_CLUSTER_OCID}" --file $HOME/.kube/config --region "${OCI_REGION}" --token-version 2.0.0
      mkdir -p ~/.kube
      echo "${OKE_KUBECONFIG_CONTENT}" | base64 -d > $HOME/.kube/config # Use base64 to decode if Kubeconfig is a base64-encoded variable
      chmod 600 $HOME/.kube/config
      export KUBECONFIG=$HOME/.kube/config
      kubectl config use-context ${OKE_KUBECONFIG_CLUSTER_CONTEXT} # Replace with actual context name

  - type: Command
    name: "Deploy with Helm"
    command: |
      # Assuming Helm CLI is available in the build runner.
      # The image tag comes from the build artifact's resolved digest/tag.
      # ENVIRONMENT variable will be passed from the OCI DevOps pipeline parameter.
      # OCIR_REPOSITORY_URL will be an environment variable.
      # DOCKER_IMAGE_TAG is passed from the build stage's output artifact.
      HELM_NAMESPACE="${ENVIRONMENT}"
      # Ensure the namespace exists before deploying
      kubectl get ns "${HELM_NAMESPACE}" || kubectl create ns "${HELM_NAMESPACE}"

      helm upgrade --install "${ENVIRONMENT}-node-app" ./charts/app \
        --namespace "${HELM_NAMESPACE}" \
        --set image.repository="${OCIR_REPOSITORY_URL}" \
        --set image.tag="${DOCKER_IMAGE_TAG}" \
        --set mysql.connectionString="mysql://${MYSQL_DB_USER}:${MYSQL_DB_PASSWORD}@tcp(${MYSQL_DB_IP_ADDRESS}:3306)/${MYSQL_DB_NAME}" \
        --wait --timeout 300s

  - type: Command
    name: "Health Check (Smoke Test)"
    command: |
      # Wait for the deployment to be ready
      kubectl rollout status deployment/${ENVIRONMENT}-node-app -n ${ENVIRONMENT} --timeout=300s

      # Get the internal Load Balancer IP
      LB_IP=$(kubectl get svc ${ENVIRONMENT}-node-app-service -n ${ENVIRONMENT} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
      if [ -z "$LB_IP" ]; then
        echo "LoadBalancer IP not found. Retrying in 10 seconds..."
        sleep 10
        LB_IP=$(kubectl get svc ${ENVIRONMENT}-node-app-service -n ${ENVIRONMENT} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
      fi

      if [ -z "$LB_IP" ]; then
        echo "Failed to get LoadBalancer IP. Deployment might have failed."
        exit 1
      fi

      echo "Performing smoke test on http://${LB_IP}/health"
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${LB_IP}/health)
      if [ "$HTTP_CODE" -eq 200 ]; then
        echo "Health check passed! HTTP Status: $HTTP_CODE"
      else
        echo "Health check failed! HTTP Status: $HTTP_CODE"
        exit 1
      fi

  - type: Command
    name: "Rollback on Failure"
    timeoutInSeconds: 120
    runAs:
      # If this step is triggered, it means a previous step failed.
      # OCI DevOps handles `onFailure` for stages. You might need to configure this
      # within the OCI DevOps pipeline definition for a specific stage.
      # This is a conceptual rollback step.
    command: |
      echo "Deployment failed. Attempting to rollback to previous Helm revision..."
      # Get the last successful revision number
      LAST_SUCCESSFUL_REVISION=$(helm history ${ENVIRONMENT}-node-app -n ${ENVIRONMENT} | grep "deployed" | awk '{print $1}' | tail -n 2 | head -n 1)

      if [ -n "$LAST_SUCCESSFUL_REVISION" ]; then
        echo "Rolling back to revision ${LAST_SUCCESSFUL_REVISION}..."
        helm rollback ${ENVIRONMENT}-node-app ${LAST_SUCCESSFUL_REVISION} -n ${ENVIRONMENT} --wait --timeout 180s
        echo "Rollback initiated. Please verify the application state."
      else
        echo "No previous successful revision found for rollback. Manual intervention required."
      fi